# Local Supabase CLI config for BORED.
# Hosted region, Apple secrets, and the anon key live in the dashboard, not here.
# Turn-on steps: docs/backend.md

project_id = "bored"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "bored://dev/backup"
additional_redirect_urls = ["bored://dev/backup"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Optional fallback. The app never calls it on launch.
enable_anonymous_sign_ins = true
# Reserved for a future "upgrade anonymous backup to Apple" flow. The client does not link yet.
enable_manual_linking = true

[auth.rate_limit]
anonymous_users = 30

[auth.external.apple]
enabled = false
client_id = ""
# Do not commit the Apple secret. Export SUPABASE_AUTH_EXTERNAL_APPLE_SECRET instead.
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false
